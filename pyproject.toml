[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-legal-text-mining"
version = "0.1.0"
description = "Plateforme de Text Mining juridique arabe"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "nltk",
    "joblib",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings>=2.9,<3",
    "qdrant-client",
    "google-genai"
]

[project.optional-dependencies]
nlp = [
    "transformers",
    "sentence-transformers",
    "accelerate",
    "seqeval"
]

dev = [
    "pytest",
    "httpx",
    "ruff",
    "jupyterlab",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
